# Только сервер ИИ для Android APK; сайт не публикуется. Ключ AnyModel вводится только в Render Environment.
services:
  - type: web
    name: racionika
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm run start -w @racionika/server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: 'false'
      - key: AI_PROVIDER
        value: anymodel
      - key: ANYMODEL_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ACCESS_CODE
        sync: false
      # Точные ID vision/imageToText из каталога AnyModel, с префиксами.
      # Для первого теста можно задать один и тот же ID в обеих переменных.
      - key: MODEL_FAST
        sync: false
      - key: MODEL_ACCURATE
        sync: false
      - key: MOCK_AI
        value: 'false'
      - key: GLOBAL_DAILY_REQUEST_CAP
        value: 300
