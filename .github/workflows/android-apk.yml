name: Android APK
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Публичный HTTPS URL сервера Render (не ключ AnyModel)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # Default includes obsolete 'tools', which is no longer available.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: node scripts/android-config.mjs
      - run: npm run build -w @racionika/shared
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run apk:debug
      - uses: actions/upload-artifact@v4
        with:
          name: racionika-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  draft-release:
    name: Create draft release
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: racionika-debug-apk
          path: release
      - name: Attach APK to a new draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -s release/app-debug.apk
          TAG="android-debug-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > release-notes.md <<EOF_NOTES
          Тестовая debug-сборка Android. Это черновик, публикация выполняется вручную.

          Установочный файл: app-debug.apk (скачивать и устанавливать без распаковки).
          Для ИИ требуется интернет и код доступа к серверу. Ключ AnyModel в APK не включён.
          Стабильная release-подпись ещё не настроена: совместимость обновления с предыдущими debug-сборками не гарантируется. Перед удалением приложения экспортируйте данные.

          Коммит: ${GITHUB_SHA}
          Сборка: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF_NOTES
          gh release create "$TAG" \
            'release/app-debug.apk#Рационика — установочный APK' \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Рационика — Android APK #${GITHUB_RUN_NUMBER} (попытка ${GITHUB_RUN_ATTEMPT})" \
            --notes-file release-notes.md
