name: Android APK
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Публичный HTTPS URL сервера Render (не ключ AnyModel)'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_BASE_URL: ${{ inputs.api_base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: node scripts/android-config.mjs
      - run: npm run build -w @racionika/shared
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run apk:debug
      - uses: actions/upload-artifact@v4
        with:
          name: racionika-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
