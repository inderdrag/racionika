// Official Google-hosted mirror of Maven Central, restricted to Kotlin artifacts.
// Installed before each project's buildscript: this also covers Capacitor plugins.
gradle.beforeProject { project ->
    def repositories = project.buildscript.repositories
    def kotlinMirror = repositories.maven {
        name = 'KotlinMavenCentralMirror'
        url = uri('https://maven-central.storage-download.googleapis.com/maven2')
        content {
            includeGroupByRegex 'org\\.jetbrains\\.kotlin(\\..*)?'
        }
    }
    repositories.remove(kotlinMirror)
    repositories.addFirst(kotlinMirror)
}
